name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Toolchains: Go comes from backend/go.mod (1.26.10) in every job; Node is 24,
# the minimum in package.json engines, plus 26 in the frontend matrix.
#
# Supply chain: every action is pinned to a full commit SHA with its version
# in a comment, govulncheck is pinned in tools/go.mod, and the Dockerfile pins
# its base images by digest. Dependabot updates all three.
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
      - name: Check formatting
        run: |
          # Fail on a gofmt error (such as a syntax error) as well as on files
          # that need formatting.
          if ! unformatted="$(gofmt -l .)"; then
            echo "gofmt failed"
            exit 1
          fi
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./... -race -cover

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    name: frontend (node ${{ matrix.node }})
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check the API types match the OpenAPI document
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high
      - name: Audit end-to-end dependencies
        working-directory: e2e
        run: npm ci && npm audit --audit-level=high
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: Scan Go code and standard library
        working-directory: tools
        run: go tool govulncheck -C ../backend ./...

  # The repository's own guards: the publish script against fake curl, docker
  # and gh; the supply-chain and workflow checks with their fixtures; and the
  # Makefile gofmt guard.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
      - name: Check that actions, base images and tools are pinned
        run: scripts/check-supply-chain.sh .
      - name: Check the publication path keeps its invariants
        run: scripts/check-workflow.sh
      - name: Test the scripts
        run: make scripts-test

  # Builds the image once; everything after this point uses these exact bytes.
  # The container is started and smoke tested, then scanned, then handed to
  # publish as an artifact together with its image ID.
  image:
    runs-on: ubuntu-latest
    outputs:
      image-id: ${{ steps.build.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        id: build
        run: |
          docker build -t sezzle-calculator:ci .
          echo "image-id=$(docker image inspect --format '{{.Id}}' sezzle-calculator:ci)" >> "$GITHUB_OUTPUT"
      - name: Smoke test the container
        run: scripts/smoke-test.sh sezzle-calculator:ci
      # The Trivy release is the one this action pins at this commit, so it
      # moves only when Dependabot updates the action.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sezzle-calculator:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Save the tested image
        run: docker save sezzle-calculator:ci | gzip > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
          if-no-files-found: error

  # Publishes the tested image to GitHub Container Registry, only for pushes to
  # main and only after every other job has passed. It needs no secret beyond
  # the workflow token. scripts/publish.sh does the work and is covered by
  # scripts/publish_test.sh: it asks the registry's distribution API whether
  # the commit tag exists and pushes only on a 404 MANIFEST_UNKNOWN, or
  # NAME_UNKNOWN when the repository does not exist yet (any other answer
  # fails the job), and points latest at the published digest only
  # while this commit is still the head of main. Ordering between concurrent
  # runs is enforced by the concurrency group, which runs publishes on main one
  # at a time, together with that head check. A rerun after a failed promotion
  # finishes it. scripts/check-workflow.sh keeps this job's shape from drifting.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, e2e, security, scripts, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Load and verify the tested image
        run: |
          gunzip -c image.tar.gz | docker load
          loaded="$(docker image inspect --format '{{.Id}}' sezzle-calculator:ci)"
          if [ "$loaded" != "${{ needs.image.outputs.image-id }}" ]; then
            echo "Loaded image $loaded is not the tested image ${{ needs.image.outputs.image-id }}"
            exit 1
          fi
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # The image is passed by the ID verified above, not by a tag that could
      # point elsewhere. GITHUB_TOKEN gets a pull token for the registry lookup.
      - name: Publish the commit tag and promote latest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish.sh "${{ needs.image.outputs.image-id }}" "${{ github.sha }}" ghcr.io/gartox/sezzle-calculator
