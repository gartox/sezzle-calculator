# Weekly dependency updates. Minor and patch bumps are grouped into one pull
# request per ecosystem; majors still arrive on their own. This keeps every
# pin current: npm and Go modules, the govulncheck tool module, the Dockerfile
# base image digests and the commit SHAs of the GitHub Actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Go tools such as govulncheck, pinned in their own module.
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Base image digests in the Dockerfile (FROM image:tag@sha256:...).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Actions pinned to commit SHAs; Dependabot updates the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
