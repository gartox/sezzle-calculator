openapi: 3.1.0
info:
  title: Calculator API
  version: 1.0.0
  description: |
    One endpoint performs every arithmetic operation. Every error, including
    404 and 405, uses the same envelope with a stable `code` for clients and
    a human-readable `message`.

    Operands and results are IEEE 754 doubles; results are rounded to 12
    significant digits so that `0.1 + 0.2` is `0.3`.
servers:
  - url: /
    description: Same origin as the frontend.

paths:
  /api/v1/calculate:
    post:
      operationId: calculate
      summary: Perform one arithmetic operation
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateRequest'
            examples:
              add:
                summary: Addition
                value: { operation: add, a: 2, b: 3 }
              sqrt:
                summary: Square root uses only a
                value: { operation: sqrt, a: 16 }
              percent:
                summary: 15 percent of 200
                value: { operation: percent, a: 15, b: 200 }
      responses:
        '200':
          description: The operation succeeded.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateResponse'
              examples:
                add:
                  value: { result: 5 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/health:
    get:
      operationId: health
      summary: Liveness check used by Docker and Compose
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The server is up.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value: { status: ok }
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    head:
      operationId: healthHead
      summary: Liveness check without a body, for load balancers that probe with HEAD
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The server is up.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'

  /api/v1/openapi.yaml:
    get:
      operationId: openapi
      summary: This document
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The OpenAPI document that the binary was built with.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/yaml:
              schema:
                type: string
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: >-
        Optional caller-chosen ID, echoed back and written to the access log.
        Kept only if it is 1 to 64 letters, digits, dashes or underscores;
        otherwise the server generates one.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'

  headers:
    RequestId:
      description: >-
        The request's ID: the caller's X-Request-Id when it was valid, otherwise
        32 random hex characters. Present on every response.
      schema:
        type: string

  schemas:
    Operation:
      type: string
      description: The arithmetic operation to perform.
      enum:
        - add
        - subtract
        - multiply
        - divide
        - power
        - sqrt
        - percent

    UnaryOperation:
      type: string
      description: Operations that take only `a`.
      enum:
        - sqrt

    BinaryOperation:
      type: string
      description: Operations that take `a` and `b`.
      enum:
        - add
        - subtract
        - multiply
        - divide
        - power
        - percent

    CalculateRequest:
      description: >-
        One calculation: a unary request for `sqrt`, or a binary request for
        the other six operations, which also needs `b`. Operands must be JSON
        numbers. A missing `a`, or a missing `b` for a binary operation, is
        `INVALID_OPERAND`; a wrong type is `INVALID_JSON`. A literal that a
        64-bit float cannot hold is also `INVALID_OPERAND`: one too large
        (such as `1e999`, which would become infinity) or a nonzero one too
        small (such as `1e-999`, which would round to zero). JSON Schema
        cannot express that range, so it is the one rule enforced only by the
        server. `0e-999` and the smallest subnormal `5e-324` are accepted.
        Keys and the operation name match exactly (lowercase, no surrounding
        spaces). A key that appears twice is `INVALID_JSON`. Unknown fields
        are ignored.
      oneOf:
        - $ref: '#/components/schemas/UnaryRequest'
        - $ref: '#/components/schemas/BinaryRequest'

    UnaryRequest:
      type: object
      required: [operation, a]
      properties:
        operation:
          $ref: '#/components/schemas/UnaryOperation'
        a:
          type: number
          description: The number to take the square root of.
        b:
          type: number
          description: Ignored by unary operations; allowed so clients can send one shape.

    BinaryRequest:
      type: object
      required: [operation, a, b]
      properties:
        operation:
          $ref: '#/components/schemas/BinaryOperation'
        a:
          type: number
          description: First operand.
        b:
          type: number
          description: >-
            Second operand. `power` raises `a` to `b`; `percent` returns `a`
            percent of `b`.

    CalculateResponse:
      type: object
      required: [result]
      properties:
        result:
          type: number
          description: The result rounded to 12 significant digits.

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    ErrorCode:
      type: string
      description: Stable machine-readable reason for a failed request.
      enum:
        - INVALID_JSON
        - INVALID_OPERATION
        - INVALID_OPERAND
        - DIVISION_BY_ZERO
        - NEGATIVE_SQRT
        - RESULT_OVERFLOW
        - METHOD_NOT_ALLOWED
        - NOT_FOUND
        - RATE_LIMITED
        - UNSUPPORTED_MEDIA_TYPE

    ErrorDetail:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable explanation. Never contains internals.
        requestId:
          type: string
          description: >-
            The request's ID, also sent as the X-Request-Id header. Quote it when
            reporting a problem; it identifies the request in the access log.
          examples:
            - 3f9c2a7d41e84b0c9a5d6e1f2b3c4d5e

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

  responses:
    BadRequest:
      description: >-
        The request could not be understood. Bodies over 1 MiB are rejected
        with `INVALID_JSON` as well; the API does not use 413.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidJson:
              summary: Malformed body, wrong type, empty body or trailing data
              value:
                error:
                  code: INVALID_JSON
                  message: Request body must be a JSON object with a string "operation" and numeric "a" and "b".
                  requestId: 3f9c2a7d41e84b0c9a5d6e1f2b3c4d5e
            duplicateKey:
              summary: A key appears twice
              value:
                error:
                  code: INVALID_JSON
                  message: Key "a" appears more than once in the request body.
                  requestId: 3f9c2a7d41e84b0c9a5d6e1f2b3c4d5e
            missingOperation:
              summary: No operation field
              value:
                error:
                  code: INVALID_OPERATION
                  message: 'Field "operation" is required. Supported operations: add, subtract, multiply, divide, power, sqrt, percent.'
                  requestId: 3f9c2a7d41e84b0c9a5d6e1f2b3c4d5e
            invalidOperation:
              summary: Unknown operation
              value:
                error:
                  code: INVALID_OPERATION
                  message: 'Unknown operation "modulo". Supported operations: add, subtract, multiply, divide, power, sqrt, percent.'
                  requestId: 3f9c2a7d41e84b0c9a5d6e1f2b3c4d5e
            invalidOperand:
              summary: Missing operand
              value:
                error:
                  code: INVALID_OPERAND
                  message: Operand "b" is required for "add".
                  requestId: 3f9c2a7d41e84b0c9a5d6e1f2b3c4d5e
            operandUnderflow:
              summary: A nonzero literal that would round to zero, such as 1e-999
              value:
                error:
                  code: INVALID_OPERAND
                  message: Operand "b" is too small for a 64-bit floating-point number; it would round to zero.
                  requestId: 3f9c2a7d41e84b0c9a5d6e1f2b3c4d5e
            operandOverflow:
              summary: A literal too large for a 64-bit float, such as 1e999
              value:
                error:
                  code: INVALID_OPERAND
                  message: Operand "a" is too large for a 64-bit floating-point number.
                  requestId: 3f9c2a7d41e84b0c9a5d6e1f2b3c4d5e

    NotFound:
      description: No such route under `/api/`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: No such API route.
                  requestId: 3f9c2a7d41e84b0c9a5d6e1f2b3c4d5e

    MethodNotAllowed:
      description: The route exists but not for this method.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Allow:
          description: The methods the route accepts (`POST`, or `GET, HEAD` for the read-only routes).
          schema:
            type: string
            example: POST
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            methodNotAllowed:
              value:
                error:
                  code: METHOD_NOT_ALLOWED
                  message: Use POST to calculate.
                  requestId: 3f9c2a7d41e84b0c9a5d6e1f2b3c4d5e

    UnsupportedMediaType:
      description: >-
        The body was not declared as JSON. Send `Content-Type: application/json`
        (parameters such as `charset` are allowed).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unsupportedMediaType:
              value:
                error:
                  code: UNSUPPORTED_MEDIA_TYPE
                  message: Content-Type must be application/json.
                  requestId: 3f9c2a7d41e84b0c9a5d6e1f2b3c4d5e

    UnprocessableEntity:
      description: The request was well formed but the operation cannot be performed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            divisionByZero:
              value:
                error:
                  code: DIVISION_BY_ZERO
                  message: Cannot divide by zero.
                  requestId: 3f9c2a7d41e84b0c9a5d6e1f2b3c4d5e
            negativeSqrt:
              value:
                error:
                  code: NEGATIVE_SQRT
                  message: Cannot take the square root of a negative number.
                  requestId: 3f9c2a7d41e84b0c9a5d6e1f2b3c4d5e
            resultOverflow:
              summary: Result is infinite or not a number
              value:
                error:
                  code: RESULT_OVERFLOW
                  message: The result is not a finite number.
                  requestId: 3f9c2a7d41e84b0c9a5d6e1f2b3c4d5e

    TooManyRequests:
      description: >-
        The client sent more calculations than the per-IP limit allows
        (by default 10 per second with bursts of 20). Only this endpoint is
        limited.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Whole seconds until the next request will be accepted.
          schema:
            type: integer
            minimum: 1
            example: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rateLimited:
              value:
                error:
                  code: RATE_LIMITED
                  message: Too many requests. Try again in 1 second.
                  requestId: 3f9c2a7d41e84b0c9a5d6e1f2b3c4d5e
